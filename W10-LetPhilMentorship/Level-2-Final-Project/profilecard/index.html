<!DOCTYPE html>
<html>
	<head>
		<title>Link Hub</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="Keywords" content="Full-Stack, Javascript, QA, Engineer, Developer, contact, profile card">
		<meta name="Description" content="Personal profile card project from Arnot Hugyecz, Full-Stack developer with 3 years of QA experience">
		<meta name="author" content="Arnot Hugyecz">

		<link rel="stylesheet" href="css/style.css">
		<script src="js/script.js" defer></script>
	</head>
	<body>
		
		<header>
			<h1>
				<button id="site-title-button" type="button">Link Hub</button>
			</h1>
			<button id="auth-button" type="button" class="hidden">Admin</button>
		</header>
		<main>
			<div id="public-view">
				<section id="profile-section">
   	 				<img id="profile-picture" src="assets/user-profile.svg"	alt="Link Hub default profile picture">
   	 				<h2 id="user-name"></h2>
   	 				<p id="position" class="hidden"></p>
   	 				<p id="about-me" class="hidden"></p>
				</section>
				<section id="link-card-section">
					<h2 id="link-card-title">Available link cards</h2>
					<p id="missing-card-warning">
					Currently no links are available.
					</p>
					<ul id="link-card-list">
					</ul>
				</section>
				<div id="qr-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="qr-status" tabindex="-1">
    				<img id="qr-code" class="hidden" alt="">
    				<p id="qr-status" role="status" aria-live="polite"></p>
				</div>
			</div>
			<div id="admin-view" class="hidden">
				<section id="profile-editor">
				<h2>Edit profile</h2>
					<form id="profile-form">
						<div class="form-field">	
							<label for="profile-picture-input">Profile picture</label>
								<input type="file" id="profile-picture-input" accept="image/*">
								<img id="profile-picture-preview" src="assets/user-profile.svg" alt="Profile picture preview">
						</div>
						<div class="form-field">
							<label for="display-name-input">Display name</label>
								<input type="text" id="display-name-input" required>
						</div>
						<div class="form-field">
							<label for="position-name-input">Position name</label>
								<input type="text" id="position-name-input">
						</div>
						<div class="form-field">	
							<label for="about-me-input">About me</label>
							<textarea id="about-me-input" rows="5" maxlength="150"></textarea>	
							<output id="about-me-counter" for="about-me-input">0/150</output>
						</div>
						<button type="submit">Save profile</button>
					</form>
				</section>
				<section id="card-editor">
					<h2>Manage link cards</h2>
					<form id="card-form">
						<div class="form-field">
						<label for="platform-select">Platform</label>
							<select id="platform-select" name="platform" required>
							<option value="" selected disabled>Choose a platform</option>
							<!-- JavaScript inserts platform options -->
							</select>
						</div>
							<div class="form-field">
							<label for="platform-url-input">Platform URL</label>
							<input id="platform-url-input" type="url" required pattern="https://.*">
						</div>

						<fieldset>
						<legend>Select status</legend>
						<div>
   							<input type="radio" id="platform-status-active" name="platform-status" value="active">
   							<label for="platform-status-active">Active</label>
						</div>
						<div>
   							<input type="radio" id="platform-status-inactive" name="platform-status" value="inactive" checked>
   							<label for="platform-status-inactive">Inactive</label>
						</div>
						</fieldset>
						<img id="platform-icon-preview" class="hidden" alt="">
						<button type="submit">Save card</button>
					</form>
				</section>
			</div>
		</main>
		<footer>
			<p>Creator Arnot Hugyecz</p>
			<p>2026</p>
			<p>
				<a>Privacy</a>
			</p>
		</footer>
	
	</body>

</html>
